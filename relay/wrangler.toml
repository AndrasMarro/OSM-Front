# The multiplayer relay: one Durable Object per room passes messages between the players' browsers.
# Deploy with `npx wrangler deploy` (or the "Deploy relay" GitHub workflow) on a Cloudflare account.
name = "osm-front-relay"
main = "worker.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
