<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSM-Front</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232478ff'/%3E%3Cpath d='M3 11l4-7 3 4 2-2 1 5z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="labels" aria-hidden="true"></canvas>

    <div id="hud" hidden>
      <section id="stats" class="panel" aria-label="Dein Reich"></section>
      <section class="panel" aria-label="Rangliste nach Gebiet (Zellen)"><ol id="leaderboard"></ol></section>
      <section id="controls" class="panel">
        <label for="strength">Angriffsstärke <output id="strength-value" for="strength">50 %</output></label>
        <input id="strength" type="range" min="5" max="100" step="5" value="50" />
        <p id="hover">&nbsp;</p>
        <button id="to-menu" type="button">Karte wechseln</button>
      </section>
    </div>
    <p id="banner" class="panel" role="status" hidden></p>
    <p id="toast" class="panel" role="status" aria-live="polite" hidden></p>

    <main id="menu">
      <div class="panel">
        <h1>OSM-Front</h1>
        <p>Echtzeit-Strategie auf echten OpenStreetMap-Daten. Wähle eine Karte:</p>
        <div id="maps"></div>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
