<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSM-Front</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232478ff'/%3E%3Cpath d='M3 11l4-7 3 4 2-2 1 5z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="labels" aria-hidden="true"></canvas>

    <div id="hud" hidden>
      <section id="stats" class="panel" aria-label="Dein Reich"></section>
      <section id="offers" class="panel" aria-label="Diplomatische Angebote" hidden></section>
      <section class="panel" aria-label="Rangliste nach Gebiet (Zellen)"><ol id="leaderboard"></ol></section>
      <section id="controls" class="panel">
        <label for="strength">Angriffsstärke <output id="strength-value" for="strength">50 %</output></label>
        <input id="strength" type="range" min="5" max="100" step="5" value="50" />
        <p id="hover">&nbsp;</p>
        <button id="export-map" type="button">Karte exportieren</button>
        <button id="to-menu" type="button">Karte wechseln</button>
      </section>
    </div>
    <section id="action" class="panel" aria-label="Aktionen" hidden>
      <header>
        <strong id="action-title"></strong>
        <button id="action-close" type="button" aria-label="Aktionen schließen">×</button>
      </header>
      <p id="action-info"></p>
      <div id="action-groups"></div>
    </section>
    <p id="banner" class="panel" role="status" hidden></p>
    <p id="toast" class="panel" role="status" aria-live="polite" hidden></p>

    <main id="menu">
      <div class="panel">
        <h1>OSM-Front</h1>
        <p>Echtzeit-Strategie auf echten OpenStreetMap-Daten. Wähle eine Karte:</p>
        <div id="maps"></div>
        <p id="status" role="status" aria-live="polite"></p>

        <section id="lobby" aria-label="Mehrspieler">
          <h2>Mehrspieler</h2>
          <div id="lobby-off">
            <p>Spiele mit anderen direkt von Browser zu Browser, ohne Server.</p>
            <button id="room-create" type="button">Raum erstellen</button>
          </div>
          <div id="lobby-on" hidden>
            <label>Dein Name <input id="player-name" maxlength="20" autocomplete="nickname" /></label>
            <label>Einladungslink <input id="room-link" readonly /></label>
            <button id="room-copy" type="button">Link kopieren</button>
            <ul id="players"></ul>
            <p id="lobby-status" role="status" aria-live="polite"></p>
            <button id="room-leave" type="button">Raum verlassen</button>
          </div>
        </section>

        <details id="custom">
          <summary>Eigene Karte</summary>
          <form id="custom-form">
            <label>Name <input name="name" required maxlength="40" value="Meine Karte" /></label>
            <fieldset>
              <legend>Ausschnitt in Grad</legend>
              <label>West <input name="west" type="number" step="any" min="-180" max="180" required /></label>
              <label>Süd <input name="south" type="number" step="any" min="-85" max="85" required /></label>
              <label>Ost <input name="east" type="number" step="any" min="-180" max="180" required /></label>
              <label>Nord <input name="north" type="number" step="any" min="-85" max="85" required /></label>
            </fieldset>
            <button id="custom-pick" type="button">Ausschnitt auf der Karte wählen</button>
            <label>Auflösung (Zellen in der Breite)
              <select name="width">
                <option>512</option>
                <option selected>768</option>
                <option>1024</option>
              </select>
            </label>
            <label>Zufällige Stämme <input name="tribes" type="number" min="0" max="200" step="1" value="30" required /></label>
            <button type="submit">Karte anlegen</button>
          </form>
          <label>Karte aus JSON-Datei importieren <input id="custom-import" type="file" accept="application/json,.json" /></label>
          <button id="custom-clear" type="button">Eigene Karten löschen</button>
        </details>
      </div>
    </main>

    <button id="custom-pick-done" class="panel" type="button" hidden>Diesen Ausschnitt übernehmen</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
